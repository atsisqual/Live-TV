name: Apply senior-friendly Android UX

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/senior-ux-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply Android UX patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          main = Path('android/app/src/main/java/com/atsisqual/livetv/MainActivity.java')
          text = main.read_text(encoding='utf-8')

          def once(old, new, label):
              global text
              if old not in text:
                  raise SystemExit(f'Missing expected block: {label}')
              text = text.replace(old, new, 1)

          once('import android.content.Intent;\n',
               'import android.content.Intent;\nimport android.content.pm.ActivityInfo;\n',
               'ActivityInfo import')

          once('    private Button homeButton;\n',
               '    private Button homeButton;\n    private Button streamBackButton;\n',
               'stream back field')

          once('        buildStatusOverlay();\n        setContentView(root);',
               '        buildStatusOverlay();\n        buildStreamBackButton();\n        setContentView(root);',
               'build stream back button')

          marker = '    private Button makeStatusButton(String label, boolean primary) {'
          if marker not in text:
              raise SystemExit('Missing makeStatusButton marker')
          methods = '''    private void buildStreamBackButton() {
        streamBackButton = new Button(this);
        streamBackButton.setText("← Voltar");
        streamBackButton.setAllCaps(false);
        streamBackButton.setTextSize(18);
        streamBackButton.setTextColor(Color.WHITE);
        streamBackButton.setTypeface(streamBackButton.getTypeface(), android.graphics.Typeface.BOLD);
        streamBackButton.setBackgroundColor(Color.rgb(22, 27, 35));
        streamBackButton.setMinHeight(dp(54));
        streamBackButton.setPadding(dp(18), 0, dp(18), 0);
        streamBackButton.setVisibility(View.GONE);
        streamBackButton.setOnClickListener(v -> returnToChannels());

        FrameLayout.LayoutParams params = new FrameLayout.LayoutParams(
                dp(132), dp(56), Gravity.TOP | Gravity.START);
        params.setMargins(dp(12), dp(12), 0, 0);
        root.addView(streamBackButton, params);
    }

    private void enterHomeMode() {
        setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_SENSOR_PORTRAIT);
        if (streamBackButton != null) streamBackButton.setVisibility(View.GONE);
        showSystemBars();
        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) root.requestApplyInsets();
    }

    private void enterStreamMode() {
        setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE);
        if (streamBackButton != null) {
            streamBackButton.setVisibility(View.VISIBLE);
            streamBackButton.bringToFront();
        }
    }

    private void returnToChannels() {
        mainFrameFailed = false;
        hideStatus();
        if (fullscreen != null) exitFullscreen();
        web.loadUrl(HOME_URL);
    }

    private void applySimpleModeToPage(String url) {
        if (url == null) return;
        if (isLocalHome(url)) {
            web.evaluateJavascript(
                    "(function(){var s=document.getElementById('livetv-simple-style');"
                    + "if(!s){s=document.createElement('style');s.id='livetv-simple-style';"
                    + "s.textContent='.livebadge{display:none!important}';document.head.appendChild(s);}})();",
                    null);
            return;
        }

        web.evaluateJavascript(
                "(function(){document.querySelectorAll('video,audio').forEach(function(m){"
                + "try{if(!m.dataset.livetvSound){m.muted=false;m.defaultMuted=false;m.volume=1;"
                + "m.dataset.livetvSound='1';}}catch(e){}});})();",
                null);
    }

'''
          text = text.replace(marker, methods + marker, 1)

          pattern = re.compile(r'    private void configureSystemBars\(\) \{.*?\n    \}\n\n    private void configureWebView\(\)', re.S)
          replacement = '''    private void configureSystemBars() {
        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
            getWindow().setDecorFitsSystemWindows(false);
            getWindow().setStatusBarColor(Color.TRANSPARENT);
            getWindow().setNavigationBarColor(Color.TRANSPARENT);
            if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                getWindow().setNavigationBarContrastEnforced(false);
            }

            root.setOnApplyWindowInsetsListener((view, windowInsets) -> {
                if (fullscreen != null) {
                    root.setPadding(0, 0, 0, 0);
                    return windowInsets;
                }

                Insets safe = windowInsets.getInsets(
                        WindowInsets.Type.systemBars() | WindowInsets.Type.displayCutout());
                root.setPadding(safe.left, safe.top, safe.right, safe.bottom);
                return windowInsets;
            });
            root.requestApplyInsets();
        } else {
            getWindow().setStatusBarColor(Color.BLACK);
            getWindow().setNavigationBarColor(Color.BLACK);
        }
    }

    private void configureWebView()'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('Could not replace configureSystemBars')

          once('''                if (isLocalHome(url)) {
                    getWindow().clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                    hideStatus();
                } else {
                    getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                    showLoading(url);
                }''',
               '''                if (isLocalHome(url)) {
                    enterHomeMode();
                    getWindow().clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                    hideStatus();
                } else {
                    enterStreamMode();
                    getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                    showLoading(url);
                }''',
               'page mode switching')

          once('''                if (!mainFrameFailed) hideStatus();
                if (isLocalHome(url)) maybeShowPendingUpdate();''',
               '''                if (!mainFrameFailed) hideStatus();
                applySimpleModeToPage(url);
                if (isLocalHome(url)) maybeShowPendingUpdate();''',
               'page simple-mode hook')

          once('''                root.addView(view, new FrameLayout.LayoutParams(-1, -1));
                hideSystemBars();''',
               '''                root.setPadding(0, 0, 0, 0);
                root.addView(view, new FrameLayout.LayoutParams(-1, -1));
                if (streamBackButton != null) {
                    streamBackButton.setVisibility(View.VISIBLE);
                    streamBackButton.bringToFront();
                }
                hideSystemBars();''',
               'fullscreen back button')

          once('''        if (web.canGoBack()) {
            mainFrameFailed = false;
            hideStatus();
            web.goBack();
            return;
        }''',
               '''        if (!isLocalHome(web.getUrl())) {
            returnToChannels();
            return;
        }
        if (web.canGoBack()) {
            mainFrameFailed = false;
            hideStatus();
            web.goBack();
            return;
        }''',
               'hardware back behavior')

          main.write_text(text, encoding='utf-8')

          cleaner = Path('android/app/src/main/java/com/atsisqual/livetv/AdCleaner.java')
          c = cleaner.read_text(encoding='utf-8')
          anchor = "          const originalOpen = window.open;\n"
          if anchor not in c:
              raise SystemExit('Missing AdCleaner anchor')
          sound = '''          const prepareMediaSound = root => {
            const media = [];
            try {
              if (root && root.matches && root.matches('video,audio')) media.push(root);
              if (root && root.querySelectorAll) root.querySelectorAll('video,audio').forEach(m => media.push(m));
            } catch (_) {}

            for (const item of media) {
              try {
                if (item.dataset && item.dataset.livetvSoundPrepared === '1') continue;
                const apply = () => {
                  try {
                    item.muted = false;
                    item.defaultMuted = false;
                    item.volume = 1;
                    if (item.dataset) item.dataset.livetvSoundPrepared = '1';
                  } catch (_) {}
                };
                item.addEventListener('loadedmetadata', apply, { once: true });
                setTimeout(apply, 350);
              } catch (_) {}
            }
          };

'''
          c = c.replace(anchor, sound + anchor, 1)

          old_start = '''            cleanElement(document.documentElement);
            hidePlayerChooser(document.documentElement);
            maybePromoteRdembed(document.documentElement);'''
          new_start = '''            cleanElement(document.documentElement);
            hidePlayerChooser(document.documentElement);
            prepareMediaSound(document.documentElement);
            maybePromoteRdembed(document.documentElement);'''
          if old_start not in c:
              raise SystemExit('Missing AdCleaner start block')
          c = c.replace(old_start, new_start, 1)

          old_added = '''                  cleanElement(node);
                  hidePlayerChooser(node);
                  maybePromoteRdembed(node);'''
          new_added = '''                  cleanElement(node);
                  hidePlayerChooser(node);
                  prepareMediaSound(node);
                  maybePromoteRdembed(node);'''
          if old_added not in c:
              raise SystemExit('Missing AdCleaner mutation block')
          c = c.replace(old_added, new_added, 1)
          cleaner.write_text(c, encoding='utf-8')
          PY

      - name: Commit UX update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/java/com/atsisqual/livetv/MainActivity.java android/app/src/main/java/com/atsisqual/livetv/AdCleaner.java
          git diff --cached --check
          git commit -m "Make Android TV playback senior friendly"
          git push origin HEAD:main
