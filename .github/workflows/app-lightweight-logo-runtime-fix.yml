name: Apply lightweight logo runtime fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/app-lightweight-logo-runtime-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python .github/scripts/app_lightweight_logo_runtime_patch.py

      - name: Commit update
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android
          git diff --cached --check
          git commit -m "Keep bundled logos out of channel storage"
          git push origin HEAD:main
