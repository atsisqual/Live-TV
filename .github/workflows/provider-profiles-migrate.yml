name: provider profiles migration

on:
  push:
    branches:
      - chatgpt/provider-profiles-1622
    paths:
      - tools/apply-provider-profiles-1622.py
      - .github/workflows/provider-profiles-migrate.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Apply provider profile migration
        run: python tools/apply-provider-profiles-1622.py
      - name: Commit generated changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/portugal-sports-channels.json \
                  android/app/src/main/assets/channel-logos.js \
                  android/app/src/main/assets/index.html \
                  android/app/src/main/java/com/atsisqual/livetv/ProviderProfiles.java \
                  android/app/src/main/java/com/atsisqual/livetv/SyncedEpgMainActivity.java \
                  android/app/build.gradle \
                  tests/test_provider_profiles.py
          git commit -m "Declare provider profiles per channel"
          git push origin HEAD:${{ github.ref_name }}
