name: Fix player selector escaping

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-player-selection.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Java text-block escapes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/java/com/atsisqual/livetv/AdCleaner.java')
          s = p.read_text(encoding='utf-8')
          old = s
          s = s.replace(r"livetv-player=(\d{1,2})", r"livetv-player=(\\d{1,2})", 1)
          s = s.replace(r".replace(/\s+/g", r".replace(/\\s+/g", 3)
          s = s.replace(r"/PLAYER\s+\d+/", r"/PLAYER\\s+\\d+/", 1)
          if s == old:
              raise SystemExit('No escaping changes applied')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/java/com/atsisqual/livetv/AdCleaner.java
          git diff --cached --check
          git commit -m "Fix player selector Java escaping"
          git push
