name: Patch DLive priority v1.6.3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-dlive-v1.6.3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch DLive priority and version
        shell: python
        run: |
          from pathlib import Path

          index = Path('android/app/src/main/assets/index.html')
          text = index.read_text(encoding='utf-8')

          old = "function isApiTotal(u){if(!ok(u))return false;try{const h=new URL(u).hostname.toLowerCase();return h==='apitotal.net'||h.endsWith('.apitotal.net')}catch(e){return false}}\nfunction slugFromUrl"
          new = "function isApiTotal(u){if(!ok(u))return false;try{const h=new URL(u).hostname.toLowerCase();return h==='apitotal.net'||h.endsWith('.apitotal.net')}catch(e){return false}}\nfunction isDLive(u){if(!ok(u))return false;try{const h=new URL(u).hostname.toLowerCase();return h==='dlive.sx'||h.endsWith('.dlive.sx')}catch(e){return false}}\nfunction slugFromUrl"
          if old not in text:
              raise SystemExit('isApiTotal anchor not found')
          text = text.replace(old, new, 1)

          old = "function canonicalUrl(x){if(!x||typeof x!=='object')return '';const rawSource=urlFromValue(x.source_url||x.page_url),rawBase=urlFromValue(x.url||x.embed||x.player),slug=text(x.slug).toLowerCase()||slugFromUrl(rawSource)||slugFromUrl(rawBase);if(isApiTotal(rawSource))return rawSource;if(isApiTotal(rawBase))return rawBase;if(slug&&APITOTAL_BY_SLUG[slug]&&(rawSource||x.source_url))return APITOTAL_BY_SLUG[slug];return firstPlayerFromObject(x)||rawBase||rawSource}"
          new = "function canonicalUrl(x){if(!x||typeof x!=='object')return '';const rawSource=urlFromValue(x.source_url||x.page_url),rawBase=urlFromValue(x.url||x.embed||x.player),slug=text(x.slug).toLowerCase()||slugFromUrl(rawSource)||slugFromUrl(rawBase);if(isDLive(rawSource))return rawSource;if(isDLive(rawBase))return rawBase;if(isApiTotal(rawSource))return rawSource;if(isApiTotal(rawBase))return rawBase;if(slug&&APITOTAL_BY_SLUG[slug]&&(rawSource||x.source_url))return APITOTAL_BY_SLUG[slug];return firstPlayerFromObject(x)||rawBase||rawSource}"
          if old not in text:
              raise SystemExit('canonicalUrl anchor not found')
          text = text.replace(old, new, 1)

          old = "function doImport(){const raw=text($('importText').value);if(!raw){showToast('Cola primeiro uma lista');return}let found;try{found=(raw[0]==='['||raw[0]==='{')?parseJson(raw):parseText(raw)}catch(e){showToast('Lista inválida: '+e.message);return}let a=loadCustom(),added=0,updated=0;for(const x of found){const idx=a.findIndex(y=>sameChannel(y,x));if(idx<0){a.push(x);added++}else if(isApiTotal(x.source_url||x.url)&&!isApiTotal(a[idx].source_url||a[idx].url)){a[idx]=x;updated++}else{const merged=normalizeStored({...a[idx],epg_id:x.epg_id||a[idx].epg_id,logo:x.logo||a[idx].logo,category:(x.category&&x.category!=='Outros')?x.category:a[idx].category,player:x.player||a[idx].player});if(JSON.stringify(merged)!==JSON.stringify(a[idx])){a[idx]=merged;updated++}}}localStorage.setItem(K_SORT,'manual');saveCustom(a);closeSheet();const bits=[];if(added)bits.push(added+' novo'+(added===1?'':'s'));if(updated)bits.push(updated+' atualizado'+(updated===1?'':'s'));showToast(bits.length?bits.join(' · '):'Lista já estava atualizada')}"
          new = "function doImport(){const raw=text($('importText').value);if(!raw){showToast('Cola primeiro uma lista');return}let found;try{found=(raw[0]==='['||raw[0]==='{')?parseJson(raw):parseText(raw)}catch(e){showToast('Lista inválida: '+e.message);return}let a=loadCustom(),added=0,updated=0;for(const x of found){const idx=a.findIndex(y=>sameChannel(y,x));if(idx<0){a.push(x);added++}else{const xu=x.source_url||x.url||'',yu=a[idx].source_url||a[idx].url||'';if(isDLive(xu)&&!isDLive(yu)){a[idx]=x;updated++}else if(isApiTotal(xu)&&!isDLive(yu)&&!isApiTotal(yu)){a[idx]=x;updated++}else{const merged=normalizeStored({...a[idx],epg_id:x.epg_id||a[idx].epg_id,logo:x.logo||a[idx].logo,category:(x.category&&x.category!=='Outros')?x.category:a[idx].category,player:x.player||a[idx].player});if(JSON.stringify(merged)!==JSON.stringify(a[idx])){a[idx]=merged;updated++}}}}localStorage.setItem(K_SORT,'manual');saveCustom(a);closeSheet();const bits=[];if(added)bits.push(added+' novo'+(added===1?'':'s'));if(updated)bits.push(updated+' atualizado'+(updated===1?'':'s'));showToast(bits.length?bits.join(' · '):'Lista já estava atualizada')}"
          if old not in text:
              raise SystemExit('doImport anchor not found')
          text = text.replace(old, new, 1)
          index.write_text(text, encoding='utf-8')

          gradle = Path('android/app/build.gradle')
          g = gradle.read_text(encoding='utf-8')
          if "versionCode 29" not in g or "versionName '1.6.2'" not in g:
              raise SystemExit('Expected 1.6.2/versionCode 29 not found')
          g = g.replace('versionCode 29', 'versionCode 30', 1)
          g = g.replace("versionName '1.6.2'", "versionName '1.6.3'", 1)
          gradle.write_text(g, encoding='utf-8')

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/assets/index.html android/app/build.gradle
          git diff --cached --check
          git commit -m "Prefer direct DLive channel pages"
          git push origin HEAD:main
