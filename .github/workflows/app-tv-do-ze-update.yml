name: Apply TV do Ze update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/app-tv-do-ze-update.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python .github/scripts/app_tv_do_ze_patch.py

      - name: Commit update
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android .staging
          git diff --cached --check
          git commit -m "Rebrand as TV do Zé and add update preference"
          git push origin HEAD:main
