name: Apply dark light channel logos update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/app-dark-light-logos-update.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install pillow

      - name: Apply patch
        run: python .github/scripts/app_dark_light_logos_patch.py

      - name: Commit update
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android
          git diff --cached --check
          git commit -m "Add dark light numbered channel logos"
          git push origin HEAD:main
