name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

env:
  APK_VERSION: '1.5.2'
  APK_VERSION_CODE: '19'
  SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
  SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
  SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS || secrets.ANDROID_KEY_ALIAS }}
  SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --version

      - name: Install Android platform
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare release signing
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SIGNING_KEY_BASE64:-}" || -z "${SIGNING_STORE_PASSWORD:-}" || -z "${SIGNING_KEY_ALIAS:-}" || -z "${SIGNING_KEY_PASSWORD:-}" ]]; then
            echo "::error::Permanent Android release signing secrets are required. Refusing to publish a debug-signed APK."
            exit 1
          fi

          KEYSTORE="$RUNNER_TEMP/live-tv-release.jks"
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGNED_RELEASE=true" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        shell: bash
        run: |
          set -euxo pipefail
          gradle :app:assembleRelease --stacktrace
          SOURCE="$GITHUB_WORKSPACE/android/app/build/outputs/apk/release/app-release.apk"
          APK="$GITHUB_WORKSPACE/Live-TV-v${APK_VERSION}.apk"
          cp "$SOURCE" "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Validate APK
        shell: bash
        run: |
          set -euxo pipefail
          test -s "$APK_PATH"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK_PATH" | tee /tmp/badging.txt
          grep "package: name='com.atsisqual.livetv'" /tmp/badging.txt
          grep "versionCode='${APK_VERSION_CODE}'" /tmp/badging.txt
          grep "versionName='${APK_VERSION}'" /tmp/badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK_PATH"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Live-TV-v1.5.2
          path: Live-TV-v1.5.2.apk
          if-no-files-found: error

      - name: Publish APK and update manifest to GitHub Pages
        shell: bash
        run: |
          set -euxo pipefail
          PAGES="$RUNNER_TEMP/live-tv-gh-pages"

          git fetch origin gh-pages
          git worktree add -B publish-apk "$PAGES" origin/gh-pages

          mkdir -p "$PAGES/downloads"
          cp "$APK_PATH" "$PAGES/downloads/Live-TV-v${APK_VERSION}.apk"
          cp "$APK_PATH" "$PAGES/downloads/Live-TV-latest.apk"

          cat > "$PAGES/downloads/version.json" <<EOF
          {
            "versionCode": ${APK_VERSION_CODE},
            "versionName": "${APK_VERSION}",
            "apkUrl": "https://raw.githubusercontent.com/atsisqual/Live-TV/gh-pages/downloads/Live-TV-v${APK_VERSION}.apk",
            "latestUrl": "https://raw.githubusercontent.com/atsisqual/Live-TV/gh-pages/downloads/Live-TV-latest.apk",
            "signedRelease": true,
            "notes": "Atualizador reforçado: valida pacote, versão e assinatura digital antes de abrir o instalador.",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          cd "$PAGES"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "downloads/Live-TV-v${APK_VERSION}.apk" downloads/Live-TV-latest.apk downloads/version.json

          if ! git diff --cached --quiet; then
            git commit -m "Publish Live TV v${APK_VERSION} APK"
            git push origin HEAD:gh-pages
          fi
