plugins {
    id 'com.android.application'
}

def signingPath = System.getenv('ANDROID_KEYSTORE_PATH')
def signingStorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def signingKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
def signingKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')
def hasReleaseSigning = signingPath && signingStorePassword && signingKeyAlias && signingKeyPassword

android {
    namespace 'com.atsisqual.livetv'
    compileSdk 35

    defaultConfig {
        applicationId 'com.atsisqual.livetv'
        minSdk 23
        targetSdk 35
        versionCode 23
        versionName '1.5.6'
    }

    buildFeatures {
        buildConfig true
    }

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(signingPath)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.core:core:1.15.0"
    implementation "androidx.webkit:webkit:1.15.0"
}
