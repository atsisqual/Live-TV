plugins {
    id 'com.android.application'
}

android {
    namespace 'com.atsisqual.livetv'
    compileSdk 35

    defaultConfig {
        applicationId 'com.atsisqual.livetv'
        minSdk 23
        targetSdk 35
        versionCode 12
        versionName '1.4.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.15.0"
}
