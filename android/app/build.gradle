plugins {
    id 'com.android.application'
}

android {
    namespace 'com.atsisqual.livetv'
    compileSdk 35

    defaultConfig {
        applicationId 'com.atsisqual.livetv'
        minSdk 23
        targetSdk 35
        versionCode 6
        versionName '1.3.3'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
