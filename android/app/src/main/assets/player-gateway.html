<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080a0f">
<title>TV do Zé Player Gateway</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;background:#05070a;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}body{display:flex;flex-direction:column}.bar{min-height:52px;flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:8px 10px;background:#10141b;border-bottom:1px solid #242a34}.title{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}.players{display:flex;gap:6px}.players button,.next{border:1px solid #303744;background:#181d25;color:#e9edf3;border-radius:10px;padding:8px 10px;font-weight:750}.players button.active{background:#f3f5f7;color:#0a0c10;border-color:#f3f5f7}.stage{position:relative;flex:1;min-height:0;background:#000}.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}.status{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;min-width:220px;max-width:82%;padding:14px 16px;border-radius:14px;background:rgba(10,13,18,.92);border:1px solid rgba(255,255,255,.12);text-align:center;box-shadow:0 16px 50px rgba(0,0,0,.4)}.status[hidden]{display:none}.status b{display:block;margin-bottom:5px}.status small{color:#aab2bf;line-height:1.35}.next{margin-top:11px}.error{color:#ffabb5}@media(max-width:560px){.bar{height:auto;flex-wrap:wrap}.title{width:100%;flex-basis:100%}.players{width:100%}.players button{flex:1;padding:8px 6px}}
</style>
</head>
<body>
<div class="bar"><div class="title" id="title">TV do Zé</div><div class="players" id="players"></div></div>
<div class="stage"><iframe id="frame" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe><div class="status" id="status"><b>A preparar player…</b><small id="statusText">A carregar configuração.</small><br><button class="next" id="next" hidden>Experimentar próximo player</button></div></div>
<script>
(function(){
'use strict';
var qs=new URLSearchParams(location.search);
var source=String(qs.get('source')||'').trim();
var channelName=String(qs.get('name')||qs.get('channel')||'Canal').trim();
var requested=parseInt(qs.get('player')||'1',10);if(!isFinite(requested)||requested<1||requested>20)requested=1;
var count=parseInt(qs.get('players')||'3',10);if(!isFinite(count)||count<1||count>20)count=3;
var auto=qs.get('auto')==='1';
var frame=document.getElementById('frame'),title=document.getElementById('title'),playersEl=document.getElementById('players'),status=document.getElementById('status'),statusText=document.getElementById('statusText'),nextButton=document.getElementById('next');
var current=requested,slowTimer=null,autoTimer=null;
function validSource(u){return /^https?:\/\//i.test(String(u||''))}
function setStatus(head,text,isError){status.hidden=false;var b=status.querySelector('b');b.textContent=head;b.className=isError?'error':'';statusText.textContent=text||''}
function clearTimers(){if(slowTimer)clearTimeout(slowTimer);if(autoTimer)clearTimeout(autoTimer);slowTimer=autoTimer=null}
function urlForPlayer(player){try{var u=new URL(source);u.hash='livetv-player='+player;return u.href}catch(e){return source}}
function updateLocation(player){try{var u=new URL(location.href);u.searchParams.set('player',String(player));history.replaceState(null,'',u.href)}catch(e){}}
function renderButtons(){playersEl.innerHTML='';for(var i=1;i<=count;i++){(function(player){var b=document.createElement('button');b.type='button';b.textContent='Player '+player;if(player===current)b.classList.add('active');b.addEventListener('click',function(){loadPlayer(player,true)});playersEl.appendChild(b)})(i)}}
function nextPlayer(){var n=current>=count?1:current+1;loadPlayer(n,true)}
function loadPlayer(player,userInitiated){clearTimers();current=Math.max(1,Math.min(player,count));updateLocation(current);renderButtons();nextButton.hidden=count<2;setStatus('A carregar Player '+current+'…','O fornecedor pode demorar alguns segundos a iniciar.',false);frame.src=urlForPlayer(current);slowTimer=setTimeout(function(){setStatus('Está a demorar','Podes experimentar já o próximo player.',false);nextButton.hidden=count<2},15000);if(auto&&!userInitiated&&count>1){autoTimer=setTimeout(nextPlayer,24000)}}
frame.addEventListener('load',function(){if(slowTimer){clearTimeout(slowTimer);slowTimer=null}status.hidden=true});
nextButton.addEventListener('click',nextPlayer);title.textContent=channelName;
if(!validSource(source)){setStatus('Fonte inválida','O gateway precisa de uma fonte HTTP/HTTPS válida.',true);nextButton.hidden=true;return}
loadPlayer(current,false);
})();
</script>
</body>
</html>
