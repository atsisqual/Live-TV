<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#090b0f">
<title>Provider direto indisponível</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#090b0f;color:#f5f7fa;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{display:grid;place-items:center;padding:24px}.card{width:min(460px,100%);background:#141920;border:1px solid #2b333f;border-radius:20px;padding:22px;box-shadow:0 18px 50px rgba(0,0,0,.35)}h1{font-size:21px;margin:0 0 10px}p{margin:0;color:#aab2bf;line-height:1.45}.meta{margin-top:14px;font-size:13px;color:#7f8998}.accent{color:#ff7188;font-weight:800}
</style>
</head>
<body>
<div class="card">
  <h1>Provider direto não configurado</h1>
  <p>Este canal deixou de usar o APITOTAL. É necessário configurar uma fonte direta autorizada no <span class="accent">provider registry</span>.</p>
  <div class="meta" id="meta"></div>
</div>
<script>
(function(){var q=new URLSearchParams(location.search);var c=q.get('channel')||'canal';var p=q.get('player')||'1';document.getElementById('meta').textContent=c+' · Player '+p;})();
</script>
</body>
</html>
