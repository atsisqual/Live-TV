[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "live-tv-embed-auditor"
version = "0.1.0"
description = "Allowlist-based crawler for auditing authorized web-player embeds"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Live-TV contributors" }
]
dependencies = []

[project.scripts]
live-tv-embed-audit = "live_tv.embed_auditor:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
